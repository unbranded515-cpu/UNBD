# Netlify deploy config for the Zaika on the Bay site.
#
# The app lives in the `zaika/` subfolder of the repo, so in the Netlify UI set
# the site's **Base directory** to `zaika` (then this file is picked up and the
# paths below are relative to it).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — serve index.html for client-side routes (BrowserRouter) so
# refreshing /menu, /about, etc. doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1BA37E" />
    <meta
      name="description"
      content="Dosa Run — an endless runner down a Kingston, Ontario street."
    />
    <title>Dosa Run</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231BA37E'/%3E%3Cellipse cx='16' cy='17' rx='9' ry='6' fill='%23F2802B'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --brand-green: #1ba37e;
        --brand-orange: #f2802b;
        --ink: #12202b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
        /* Keep swipes in the canvas instead of scrolling/zooming the page. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        display: block;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
